{% extends "base.html" %}
{% block title_key %}nav_pass{% endblock %}
{% block content %}
<section class="panel">
  <label class="field-label" for="pw" data-i18n="pw_label"></label>
  <div class="input-row">
    <input id="pw" class="input" type="password" dir="ltr" maxlength="128" autocomplete="new-password" autocapitalize="off" spellcheck="false" data-i18n-ph="pw_ph">
    <button id="pwToggle" class="btn btn-ghost" type="button" data-i18n="pw_show"></button>
  </div>
  <p class="note" data-i18n="pw_privacy"></p>
</section>
<section class="panel" id="pwOut" aria-live="polite"></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/tools.js') }}"></script><script src="{{ url_for('static', filename='js/password.js') }}"></script>{% endblock %}
